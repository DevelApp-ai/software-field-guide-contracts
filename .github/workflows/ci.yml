name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# TEMPORARY DIAGNOSTICS VERSION (will be reverted): every policy step's
# output is captured to /tmp/diag.log and posted as a PR comment on failure.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  policy:
    name: policies, tests, examples, wasm smoke test
    runs-on: ubuntu-latest
    env:
      OPA_VERSION: v1.21.3
      YQ_VERSION: v4.44.3
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          {
            echo '=== Install OPA ==='
            set -x
            curl -sSL -o opa "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
            sudo install -m 755 opa /usr/local/bin/opa
            opa version
            echo 'OPA-OK'
          } > /tmp/diag.log 2>&1

      - name: Install yq
        run: |
          {
            echo '=== Install yq ==='
            set -x
            curl -sSL -o yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
            sudo install -m 755 yq /usr/local/bin/yq
            yq --version
            echo 'YQ-OK'
          } >> /tmp/diag.log 2>&1

      - name: Format check
        run: |
          {
            echo '=== Format check ==='
            opa fmt --fail -l policies
            echo 'FMT-OK'
          } >> /tmp/diag.log 2>&1

      - name: Compile check
        run: |
          {
            echo '=== Compile check ==='
            opa check policies
            echo 'CHECK-OK'
          } >> /tmp/diag.log 2>&1

      - name: Unit tests
        run: |
          {
            echo '=== Unit tests ==='
            opa test policies -v
            echo 'TEST-OK'
          } >> /tmp/diag.log 2>&1

      - name: Validate examples
        run: |
          {
            echo '=== Validate examples ==='
            make examples
            echo 'EXAMPLES-OK'
          } >> /tmp/diag.log 2>&1

      - name: Observability cardinality demo
        run: |
          {
            echo '=== obs-demo ==='
            make obs-demo
            echo 'OBS-OK'
          } >> /tmp/diag.log 2>&1

      - name: Alert-to-record linkage demo
        run: |
          {
            echo '=== alerts-demo ==='
            make alerts-demo
            echo 'ALERTS-OK'
          } >> /tmp/diag.log 2>&1

      - name: Wasm build and browser-bundle smoke test
        run: |
          {
            echo '=== e2e ==='
            make e2e
            echo 'E2E-OK'
          } >> /tmp/diag.log 2>&1

      - name: Assemble playground
        run: |
          {
            echo '=== site ==='
            make site
            echo 'SITE-OK'
          } >> /tmp/diag.log 2>&1

      - name: Diagnostics on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '**CI diagnostics round 2 - temporary step, will be reverted**'
            echo '```'
            tail -n 400 /tmp/diag.log 2>/dev/null || echo '(diag log missing)'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md || true

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-build

  deploy:
    name: Deploy playground to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: policy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
