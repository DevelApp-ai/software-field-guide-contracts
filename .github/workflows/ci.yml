name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two deploy mechanisms must not fight over the Pages deployment:
# the old Jekyll scaffold was removed in favor of this workflow, which
# builds the playground and deploys it through the official Pages actions.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  policy:
    name: policies, tests, examples, wasm smoke test
    runs-on: ubuntu-latest
    env:
      OPA_VERSION: v1.21.3
      YQ_VERSION: v4.44.3
    steps:
      - uses: actions/checkout@v4

      - name: Install OPA
        run: |
          curl -sSL -o opa "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          sudo install -m 755 opa /usr/local/bin/opa
          opa version

      - name: Install yq
        run: |
          curl -sSL -o yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo install -m 755 yq /usr/local/bin/yq
          yq --version

      - name: Format check
        run: opa fmt --fail -l policies

      - name: Compile check
        run: opa check policies

      - name: Unit tests
        run: opa test policies -v

      - name: Validate examples
        run: make examples

      - name: Observability cardinality demo
        run: make obs-demo

      - name: Alert-to-record linkage demo
        run: make alerts-demo

      - name: Action registry scoping demo
        run: make actions-demo

      - name: Deletion evidence demo
        run: make erasure-demo

      - name: Wasm build and browser-bundle smoke test
        run: make e2e

      - name: Assemble playground
        run: make site

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-build

  deploy:
    name: Deploy playground to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: policy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4