name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two deploy mechanisms must not fight over the Pages deployment:
# the old Jekyll scaffold was removed in favor of this workflow, which
# builds the playground and deploys it through the official Pages actions.
# TEMPORARY DIAGNOSTICS VERSION (will be reverted): captures early-step
# output to /tmp/diag.log and posts it as a PR comment when the job fails.
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  policy:
    name: policies, tests, examples, wasm smoke test
    runs-on: ubuntu-latest
    env:
      OPA_VERSION: v1.21.3
      YQ_VERSION: v4.44.3
    steps:
      - uses: actions/checkout@v4

      - name: Post-checkout probe
        run: |
          {
            echo '=== post-checkout probe ==='
            pwd
            ls -la
            git log -1 --format='%H %s'
            git rev-parse HEAD
            ls -la policies | head -5
          } > /tmp/diag.log 2>&1 || true

      - name: Install OPA
        run: |
          {
            echo '=== Install OPA ==='
            set -x
            curl -sSL -o opa "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
            ls -l opa
            head -c 16 opa | od -An -tx1 || true
            sudo install -m 755 opa /usr/local/bin/opa
            opa version
            echo 'OPA-OK'
          } >> /tmp/diag.log 2>&1

      - name: Install yq
        run: |
          {
            echo '=== Install yq ==='
            set -x
            curl -sSL -o yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
            ls -l yq
            head -c 16 yq | od -An -tx1 || true
            sudo install -m 755 yq /usr/local/bin/yq
            yq --version
            echo 'YQ-OK'
          } >> /tmp/diag.log 2>&1

      - name: Format check
        run: opa fmt --fail -l policies

      - name: Compile check
        run: opa check policies

      - name: Unit tests
        run: opa test policies -v

      - name: Validate examples
        run: make examples

      - name: Observability cardinality demo
        run: make obs-demo

      - name: Alert-to-record linkage demo
        run: make alerts-demo

      - name: Wasm build and browser-bundle smoke test
        run: make e2e

      - name: Assemble playground
        run: make site

      - name: Diagnostics on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '**CI diagnostics - temporary step, will be reverted**'
            echo '```'
            tail -n 200 /tmp/diag.log 2>/dev/null || echo '(diag log missing - failure happened before the probe step)'
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md || true

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-build

  deploy:
    name: Deploy playground to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: policy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
