  - {fabric: cloud, rule: R2, direction: egress, type: udp, port: 5432}
  - {fabric: host-firewall, rule: R2, direction: egress, type: tcp, port: 5432}

  - {fabric: cloud, rule: R3, direction: egress, type: tcp, port: 443}
