# BROKEN VARIANT — type mismatch — The Software Field Guide, issue #80.
#
# The control renders with ONE field changed: the cloud fabric
# renders R2 (api → db) as udp, while the contract says tcp. Within
# the modeled subset the two documents are no longer rendering the
# same protocol — the gate names the field, the fabric, and both
# documents. The seeded mismatch must be caught exactly once.

version: 1
