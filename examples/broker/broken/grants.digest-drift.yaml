# Broken variant — gate/digest-drift (book issue #104).
#
# The storefront build's pull grant pins a well-formed sha256
# digest the package manifest never published for the checkout
# component — a grant for bytes the package never shipped. The
# gate refuses it with gate/digest-drift, citing both
# documents and the digests the manifest actually carries.
#
# The document is the control (examples/broker/grants.yaml) with
# exactly one grant changed; every broken variant in this
# directory bites with exactly one finding.


version: 1
reviewedOn: 2026-10-18
owner: Platform team

# The consumer identities the broker declares — the identities a
# grant may name. A grant naming an undeclared principal is
# refused: an identity the broker never declared is a principal
# nobody granted.
principals:
  - storefront-build
  - payments-build

grants:
  # The storefront build consumes the checkout package: pull only,
  # pinned to the digest the package publishes, until the end of
  # the quarter the review covers.
  - principal: storefront-build
    component: payments-checkout
    digest: a75f47bd3c7d7f1bcaf4a76a163ed589b5f26708b44996a37ee7f789e9c31c15
    actions:
      - pull
    expires: 2026-12-31

  # The payments build consumes the platform baseline the checkout
  # package pins as its dependency: pull and attest, pinned to the
  # digested dependency, until the platform team's next review.
  - principal: payments-build
    component: platform-baseline
    digest: d6545bd91e241a29c789035968856b675b8987840191a5211d6f0fdfae60be44
    actions:
      - pull
      - attest
    expires: 2027-01-31
