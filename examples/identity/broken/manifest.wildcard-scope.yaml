# Identity manifest — The Software Field Guide, issue #108.
#
# The identity-and-secrets-scope chapter's YAML: the platform's
# identities as data — each app that runs with a credential in hand
# declares its name and the secrets it references, each reference
# narrowed to the scope it uses and stamped with the day the
# reference was granted.
#
# BROKEN VARIANT — the web checkout's reference carries the
# wildcard scope: a scope that means everything means the platform
# granted nothing it can name. The validator refuses:
# reference/scope-wildcard — scope minimality is the manifest's
# own clause, judged before the join. Bites exactly once at
# validation.
#
# The estate is seeded, after the chapter's worked example: three
# declared identities on the payments platform, one of them
# asking for everything. Example dates are chosen relative to the
# CI anchor date 2026-10-20.

version: 3
reviewedOn: 2026-10-18
owner: Platform security

identities:
  # The checkout front end — granted, in one line, more than the
  # whole catalog can vouch for.
  - name: checkout-web
    references:
      - secret: payments-api-key
        scope: '*'
        since: 2026-08-02

  - name: checkout-worker
    references:
      - secret: payments-api-key
        scope: payments:charges
        since: 2026-09-14
      - secret: settlement-signing-key
        scope: settlements:sign
        since: 2026-08-20

  - name: billing-exporter
    references:
      - secret: billing-read-token
        scope: billing:read
        since: 2026-09-01
