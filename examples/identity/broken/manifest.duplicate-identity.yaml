# Identity manifest — The Software Field Guide, issue #108.
#
# The identity-and-secrets-scope chapter's YAML: the platform's
# identities as data — each app that runs with a credential in hand
# declares its name and the secrets it references, each reference
# narrowed to the scope it uses and stamped with the day the
# reference was granted.
#
# BROKEN VARIANT — the checkout front end is declared twice: two
# identity rows, one name, and no way to answer for the app once
# over. The validator refuses: identity/name-duplicate — one
# identity, one row. Bites exactly once at validation.
#
# The estate is seeded, after the chapter's worked example: the
# manifest's three declared identities, plus a fourth row that
# shadows one of them. Example dates are chosen relative to the
# CI anchor date 2026-10-20.

version: 3
reviewedOn: 2026-10-18
owner: Platform security

identities:
  - name: checkout-web
    references:
      - secret: payments-api-key
        scope: payments:charges
        since: 2026-08-02

  - name: checkout-worker
    references:
      - secret: payments-api-key
        scope: payments:charges
        since: 2026-09-14
      - secret: settlement-signing-key
        scope: settlements:sign
        since: 2026-08-20

  - name: billing-exporter
    references:
      - secret: billing-read-token
        scope: billing:read
        since: 2026-09-01

  # The same front end, declared again — legacy of a migration
  # nobody finished.
  - name: checkout-web
    references: []
