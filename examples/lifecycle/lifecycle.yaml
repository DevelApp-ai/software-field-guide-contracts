# Component lifecycle record — The Software Field Guide, issue #105.
#
# A transition recorded once and never refreshed is a question, not a
# fact: this record is the component's paper trail — the bake that
# produced its image, the patch folded in, the upgrade with its
# rehearsed rollback — each transition carrying the evidence its type
# demands (a bake its sha256 image digest, a patch its provenance
# source and commit, an upgrade the date its rollback was rehearsed).
# The gate joins the record against the component package manifest
# (examples/component/package.yaml) by component name and refuses: a
# record documenting a component the manifest never packaged, a
# transition without its evidence, a review that never saw a
# transition recorded after it, and a record nobody has re-read in a
# year. The component lifecycle record is the lifecycle-evidence
# pattern (issue #105) applied to the component-package chapter's
# worked estate.
#
# The estate is seeded, after the lifecycle chapter's worked example:
# the payments team's checkout package release 1.4.0 — the bake that
# produced its image at the digest the manifest publishes, the patch
# folded in from the release pipeline's commit, and the upgrade with
# a rollback rehearsed the day before it was recorded — reviewed
# 2026-10-18 with every transition already on it. Example dates are
# chosen relative to the CI anchor date 2026-10-20.

version: 1
reviewedOn: 2026-10-18
owner: Payments team

# The component this record tracks — the join runs on this name.
component: payments-checkout

# The versioned transitions, in the order they were recorded. Each
# row names its type (bake, patch, upgrade) and the date it was
# recorded on or before the review, and carries the evidence its type
# demands.
transitions:
  # The bake: the image that produced release 1.4.0, pinned by the
  # same sha256 digest the package manifest publishes.
  - type: bake
    recordedOn: 2026-09-30
    imageDigest: 5766fab530f684e9ba8da7695939a9d13b278ffda31a1ea05bd825fc549d300c

  # The patch: the fix folded in after the bake, with its provenance
  # — where the change came from, and the commit that built it.
  - type: patch
    recordedOn: 2026-10-08
    provenance:
      source: payments/checkout.git
      commit: 9f31c0e

  # The upgrade: the rollout that replaced the running release,
  # having rehearsed the way back the day before it was recorded.
  - type: upgrade
    recordedOn: 2026-10-15
    rollback:
      rehearsedOn: 2026-10-14
