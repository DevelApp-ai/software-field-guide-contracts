# Broken variant for the policy demo — The Software Field Guide,
# issue #103.
#
# The drift: the pci-scan row's canonical path is a glob. The
# validator refuses glob-shaped paths outright (policy/path-glob):
# every binding is an exact path, and a binding that can match
# anything is a binding the join refuses to guess. Caught by
# `make check-policy POLICY_CATALOG=examples/policy/broken/catalog.path-glob.yaml`.

