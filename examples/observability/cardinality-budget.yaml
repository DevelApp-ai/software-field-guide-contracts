# The cardinality budget — The Software Field Guide, "observability-engineering".
#
# Cardinality is a budget: a pull request that adds an unbounded label
# to a metric is a review comment, not a discovery in a 3 a.m. page.
# Per metric, a ceiling on label combinations (total) and an allocation
# per label (maxValues). The budget has an owner and a review cadence.
owner: Storefront team
reviewedOn: 2026-10-01
metrics:
  - name: storefront_requests_total
    total: 4000
    allocations:
      - {label: method, maxValues: 2}
      - {label: route, maxValues: 2}
      - {label: status, maxValues: 100}
  - name: payment_settlements_total
    total: 200
    allocations:
      - {label: result, maxValues: 2}
      - {label: provider, maxValues: 10}
