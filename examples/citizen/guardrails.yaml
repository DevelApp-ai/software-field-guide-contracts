# Platform guardrail registry — The Software Field Guide, issue #84.
#
# The platform's word: the data rails a binding may ride, and the
# platform floor each guardrail must meet. A binding that does not
# ride a declared rail is an escape hatch; a guardrail built below
# its floor is guardrail drift after a platform upgrade. The
# registry is maintained by the platform team, not the citizen.

version: 1
reviewedOn: 2026-10-15
owner: Platform team

# The data rails: the only ways a citizen app's binding may reach
# data on this platform.
dataRails:
  - platform-data-api

# The platform floor: the minimum version each guardrail must meet
# after the latest platform upgrades.
platformFloor:
  - name: data-guardrail
    floor: 3
  - name: action-guardrail
    floor: 2
