# Data contract enforcement record — The Software Field Guide,
# issue #106.
#
# The CI's word: the checks it actually ran for one dataset, and
# the day each ran. The conformance gate joins this record against
# the data contract (datacontract.yaml) — a conformance gate, not
# an advisor: evidence for a dataset the contract never names, a
# declared check the record never shows running, and evidence for
# a check the contract never declared are all refused. The
# validator is honest about what it models: it checks that the
# evidence facts are recorded and datable — not that the runs
# succeeded or that the numbers they checked were good; those
# answers live in the pipelines themselves, not in policy.
#
# BROKEN VARIANT — the record never shows the quality-thresholds
# check running: the contract swears by it and the pipelines never
# swore. The gate refuses: gate/check-never-run, verdict drifts —
# a declared check without a run is enforcement evidence that does
# not exist. Bites exactly once at the join.
#
# The record is seeded, after the chapter's worked example: the
# data contract CI's word for the payments team's settlement
# dataset — minus one check. Example dates are chosen relative to
# the CI anchor date 2026-10-20.

dataset: payments.settlements
version: 1
reviewedOn: 2026-10-19
owner: Payments team

# The checks the CI ran, one row per check, with the day each
# ran. The gate requires a row for every check the contract
# declares, and refuses a row for any check it never did.
# (the quality-thresholds run row is deliberately missing)
runs:
  - check: schema-conformance
    ranOn: 2026-10-20
  - check: freshness-lag
    ranOn: 2026-10-20
