# Broken variant: a policy binding present in only one fabric —
# book issue #102.
#
# The package manifest (examples/component/package.yaml) declares
# the tier-egress binding, and only azure-west-europe holds it in
# force — aws-eu-central and onprem-vsphere never rendered it. The
# gate refuses with gate/binding-missing, once per fabric that
# never ran the policy.

version: 1
reviewedOn: 2026-10-18
owner: Platform team
component: payments-checkout

fabrics:
  - azure-west-europe
  - aws-eu-central
  - onprem-vsphere

renders:
  # The only fabric that rendered the declared tier-egress binding.
  - fabric: azure-west-europe
    version: 1.4.0
    digest: 5766fab530f684e9ba8da7695939a9d13b278ffda31a1ea05bd825fc549d300c
    bindings:
      - {policy: pci-scan, path: /policies/pci-scan.rego}
      - {policy: tier-egress, path: /policies/tier-egress.rego}

  # The drift: no tier-egress binding in force here.
  - fabric: aws-eu-central
    version: 1.4.0
    digest: 5766fab530f684e9ba8da7695939a9d13b278ffda31a1ea05bd825fc549d300c
    bindings:
      - {policy: pci-scan, path: /policies/pci-scan.rego}

  # The drift: and none here either.
  - fabric: onprem-vsphere
    version: 1.4.0
    digest: 5766fab530f684e9ba8da7695939a9d13b278ffda31a1ea05bd825fc549d300c
    bindings:
      - {policy: pci-scan, path: /policies/pci-scan.rego}
