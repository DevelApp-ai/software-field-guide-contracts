# Broken variant: a requirement with no controls — book issue
# #107.
#
# The catalog declares ISO-27001-A.5.1, but no control maps to it:
# a requirement nobody controls is a promise nobody keeps. The gate
# fails with gate/requirement-unmapped and renders the drifts
# verdict.

version: 1
reviewedOn: 2026-10-01
owner: Compliance team

requirements:
  - id: PCI-DSS-2.2.7
    title: Firewall and router rule sets are reviewed and re-approved at least every six months
    source: PCI DSS v4.0
  - id: PCI-DSS-3.4.1
    title: Cardholder data is rendered unreadable wherever it is stored
    source: PCI DSS v4.0
  - id: SOC2-CC6.1
    title: Logical access to infrastructure is restricted to authorized users
    source: SOC 2 Type II, CC6.1
  - id: GDPR-ART-17
    title: Personal data is erased within thirty days of a verified erasure request
    source: GDPR art. 17
  - id: ISO-27001-A.5.1
    title: Policies for information security are defined and approved
    source: ISO/IEC 27001 A.5.1
