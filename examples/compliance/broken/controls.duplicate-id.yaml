# Broken variant: two controls sharing one id — book issue #107.
#
# CTRL-04 appears twice: the registry erasure control and its copy
# carry the same id, so a finding against CTRL-04 is a finding
# against who-knows-what. The validator fails with
# control/id-duplicate and the gate renders the unreadable verdict.

version: 1
reviewedOn: 2026-10-18
owner: Platform team

evidenceSources:
  - id: edge-firewall-review
    kind: review record
    status: live
  - id: encryption-config-scan
    kind: scanner output
    status: live
  - id: edge-access-logs
    kind: log store
    status: live
  - id: erasure-case-registry
    kind: case registry
    status: live

controls:
  - id: CTRL-01
    title: Edge firewall rule set reviewed and re-approved quarterly
    owner: Platform team
    requirements: [PCI-DSS-2.2.7]
    evidenceSource: edge-firewall-review
    reviewedOn: 2026-09-15
    intervalDays: 180
  - id: CTRL-02
    title: Data-at-rest encryption verified by the nightly config scan
    owner: Storefront team
    requirements: [PCI-DSS-3.4.1]
    evidenceSource: encryption-config-scan
    reviewedOn: 2026-10-10
    intervalDays: 90
  - id: CTRL-03
    title: Edge access restricted to authenticated identities
    owner: Platform team
    requirements: [SOC2-CC6.1]
    evidenceSource: edge-access-logs
    reviewedOn: 2026-10-05
    intervalDays: 90
  - id: CTRL-04
    title: Erasure cases closed inside the thirty-day window
    owner: Platform team
    requirements: [GDPR-ART-17]
    evidenceSource: erasure-case-registry
    reviewedOn: 2026-07-01
    intervalDays: 180
  - id: CTRL-04
    title: Erasure cases closed inside the thirty-day window
    owner: Platform team
    requirements: [GDPR-ART-17]
    evidenceSource: erasure-case-registry
    reviewedOn: 2026-07-01
    intervalDays: 180
